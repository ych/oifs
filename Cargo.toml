[package]
name = "oifs"
version = "1.0.0"
edition = "2024"
authors = ["Yu-Chun Huang <ych@ychuang.org>"]
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }


[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bincode = "1.3"
chrono = "0.4.43"
clap = { version = "4.5.54", features = ["derive"] }
ctrlc = "3.5.1"
libc = "0.2.180"
memmap2 = "0.9.9"
nix = { version = "0.31.1", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
zstd = "0.13"

# Encryption dependencies
chacha20poly1305 = "0.10"  # XChaCha20-Poly1305 AEAD cipher
argon2 = "0.5"             # Key derivation function
rand = "0.8"               # CSPRNG for nonce generation
zeroize = { version = "1.7", features = ["derive"] }  # Secure memory wiping
blake2 = "0.10"            # Fast cryptographic hashing for Synthetic IV
base64ct = { version = "1.8", features = ["alloc"] } # Constant-time Base64url encoding


# Optional: MCP server stack. Only pulled in when the `mcp` feature is on,
# which keeps the CLI binary buildable on older rustc toolchains.
rmcp = { version = "0.16", features = ["server", "macros", "transport-async-rw", "transport-io"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
anyhow = { version = "1", optional = true }
schemars = { version = "1", optional = true }
blosc2 = "0.2.3"
rayon = "1.12.0"

# Optional: io_uring payload-read backend (P3.2). Linux-only; on other targets the
# `io_uring` feature compiles to nothing and the engine falls back to `pread`.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7.15", optional = true }

[features]
default = ["mcp", "io_uring"]
mcp = ["dep:rmcp", "dep:tokio", "dep:anyhow", "dep:schemars"]
io_uring = ["dep:io-uring"]

[[bin]]
name = "oifs"
path = "src/bin/oifs.rs"

[[bin]]
name = "oifs_mcp"
path = "src/bin/oifs_mcp.rs"
required-features = ["mcp"]

[[test]]
name = "mcp_server_test"
required-features = ["mcp"]

[dev-dependencies]
tempfile = "3.8"
shuttle = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

