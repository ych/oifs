[package]
name = "oifs"
version = "1.6.1"
edition = "2024"
authors = ["Yu-Chun Huang <ych@ychuang.org>"]
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }


[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bincode = "1.3"
clap = { version = "4.5.54", default-features = false, features = ["std", "derive", "help", "usage", "error-context"], optional = true }
libc = "0.2.180"
memmap2 = "0.9.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
zstd = "0.14"

# Encryption dependencies
chacha20poly1305 = "0.10"  # XChaCha20-Poly1305 AEAD cipher
poly1305 = "0.8"          # Direct Poly1305 MAC for short-message 1-block scalar XChaCha20 fast path
aes = { version = "0.8", features = ["zeroize"] } # AES-256 block cipher for C2SP XAES-256-GCM KDF
aes-gcm = { version = "0.10", features = ["aes", "zeroize"] } # AES-256-GCM AEAD (hardware AES + PMULL/PCLMULQDQ)
aes-gcm-siv = { version = "0.11", features = ["aes"] } # RFC 8452 AES-256-GCM-SIV deterministic filename AEAD
argon2 = { version = "0.5", default-features = false, features = ["alloc"] } # Key derivation function
zeroize = { version = "1.7", default-features = false, features = ["alloc"] } # Secure memory wiping
blake2 = "0.10"            # Fast cryptographic hashing for Synthetic IV
base64ct = { version = "1.8", features = ["alloc"] } # Constant-time Base64url encoding


# Optional: MCP server stack (opt-in via `--features mcp` to keep library/CLI dependency surface small).
rmcp = { version = "0.16", features = ["server", "macros", "transport-async-rw", "transport-io"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "io-std"], optional = true }
schemars = { version = "1", optional = true }
# Optional: native C-Blosc2 interop wrappers (`filters::blosc2_compress`/`blosc2_decompress`).
# OIFS ships its own pure-Rust filter pipeline, so the C library is opt-in.
blosc2 = { version = "0.2.3", optional = true }

# Optional: io_uring payload-read backend (P3.2). Linux-only; on other targets the
# `io_uring` feature compiles to nothing and the engine falls back to `pread`.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7.15", optional = true }

[features]
default = ["cli", "io_uring"]
cli = ["dep:clap"]
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]
io_uring = ["dep:io-uring"]
blosc2 = ["dep:blosc2"]

[[bin]]
name = "oifs"
path = "src/bin/oifs.rs"
required-features = ["cli"]

[[bin]]
name = "oifs_mcp"
path = "src/bin/oifs_mcp.rs"
required-features = ["mcp"]

[[test]]
name = "mcp_server_test"
required-features = ["mcp"]

[dev-dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
tempfile = "3.8"
shuttle = "0.9"
# Property testing / fuzzing: runs under plain `cargo test`, and under
# `cargo bolero test <name>` (libfuzzer/AFL/honggfuzz/Kani) for continuous fuzzing.
bolero = "0.13"
# Random test data generation (the library itself draws randomness from the AEAD crate's OsRng).
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

