name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build release binaries
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package archive
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          ARCHIVE_NAME="oifs-${TAG}-${{ matrix.target }}"
          STAGE_DIR="target/package/${ARCHIVE_NAME}"
          mkdir -p "${STAGE_DIR}"

          # Copy CLI and MCP server binaries
          cp "target/${{ matrix.target }}/release/oifs" "${STAGE_DIR}/"
          cp "target/${{ matrix.target }}/release/oifs_mcp" "${STAGE_DIR}/"

          # Copy shared library if present
          if [ -f "target/${{ matrix.target }}/release/liboifs.so" ]; then
            cp "target/${{ matrix.target }}/release/liboifs.so" "${STAGE_DIR}/"
          elif [ -f "target/${{ matrix.target }}/release/liboifs.dylib" ]; then
            cp "target/${{ matrix.target }}/release/liboifs.dylib" "${STAGE_DIR}/"
          fi

          # Copy documentation, license, and C headers
          cp README.md "${STAGE_DIR}/"
          cp README_zh.md "${STAGE_DIR}/"
          cp LICENSE "${STAGE_DIR}/"
          mkdir -p "${STAGE_DIR}/include"
          cp include/oifs.h "${STAGE_DIR}/include/"

          # Generate tar.gz archive and sha256 checksum
          cd target/package
          tar -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/package/*.tar.gz
            target/package/*.tar.gz.sha256
