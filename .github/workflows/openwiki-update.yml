name: OpenWiki Update

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "OpenRouter model ID override"
        required: false
        default: "nvidia/nemotron-3-ultra-550b-a55b:free"
  schedule:
    # Three times weekly (Tue, Thu & Sat 08:00 UTC) so commits batch before spending API quota
    - cron: "0 8 * * 2,4,6"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: OPENROUTER_API_KEY
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Preflight change gate
        id: preflight
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual workflow_dispatch: running OpenWiki update."
            exit 0
          fi

          if [ ! -f openwiki/.last-update.json ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "No openwiki/.last-update.json found: running OpenWiki update."
            exit 0
          fi

          last_status=$(jq -r '.status // empty' openwiki/.last-update.json)
          last_head=$(jq -r '.gitHead // empty' openwiki/.last-update.json)

          if [ "$last_status" != "complete" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Previous OpenWiki run status is '${last_status:-unknown}' (incomplete): resuming update."
            exit 0
          fi

          if [ -z "$last_head" ] || ! git cat-file -e "${last_head}^{commit}" 2>/dev/null; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Previous gitHead '${last_head:-missing}' unavailable: running OpenWiki update."
            exit 0
          fi

          changed=$(git diff --name-only "$last_head" HEAD -- \
            src/ \
            include/ \
            Cargo.toml \
            openwiki/INSTRUCTIONS.md \
            ':(glob)docs/*.md')

          if [ -n "$changed" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Relevant source/design changes detected since ${last_head}:"
            echo "$changed"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=OpenWiki Update Skipped::No changes under src/, include/, Cargo.toml, openwiki/INSTRUCTIONS.md, or docs/*.md since ${last_head}."
          fi

      - name: Set up Node.js
        if: ${{ steps.preflight.outputs.should_run == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install OpenWiki
        if: ${{ steps.preflight.outputs.should_run == 'true' }}
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.9.0 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        id: openwiki
        if: ${{ steps.preflight.outputs.should_run == 'true' }}
        continue-on-error: true
        run: |
          openwiki code --update --print
          openwiki visualize openwiki --export docs/openwiki-visualizer
        env:
          NODE_OPTIONS: "--require ${{ github.workspace }}/.github/scripts/openrouter-rate-limit.cjs"
          OPENWIKI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: ${{ inputs.model_id || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
          OPENWIKI_PAGE_CONCURRENCY: "1"
          OPENWIKI_PROVIDER_RETRY_ATTEMPTS: "10"
          # Optional: also trace this workflow's own OpenWiki run to LangSmith.
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: "false"

      - name: Remove transient OpenWiki run state
        if: ${{ !cancelled() && steps.preflight.outputs.should_run == 'true' }}
        run: rm -f -- openwiki/.run.json

      - name: List OpenWiki update paths
        id: paths
        if: ${{ !cancelled() && steps.preflight.outputs.should_run == 'true' }}
        # Check if actual markdown or docs visualizer files changed before creating a PR
        run: |
          paths=openwiki,docs,AGENTS.md
          if [ -e CLAUDE.md ]; then paths="$paths,CLAUDE.md"; fi
          echo "list=$paths" >> "$GITHUB_OUTPUT"

          # Detect actual documentation (.md) or docs visualizer changes (ignore pure metadata JSONs)
          meaningful_changes=$(git status --porcelain | awk '{print $2}' | grep -E '(\.md$|^docs/)' || true)
          if [ -n "$meaningful_changes" ]; then
            echo "has_content=true" >> "$GITHUB_OUTPUT"
            echo "Meaningful content changes detected:"
            echo "$meaningful_changes"
          else
            echo "has_content=false" >> "$GITHUB_OUTPUT"
            echo "No meaningful documentation changes detected (skipping PR creation)."
          fi

      - name: Create OpenWiki update pull request
        id: create-pr
        if: ${{ !cancelled() && steps.preflight.outputs.should_run == 'true' && steps.paths.outputs.has_content == 'true' }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: ${{ steps.paths.outputs.list }}
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            OpenWiki result: ${{ steps.openwiki.outcome }}

            When the result is `failure`, this PR intentionally preserves only the
            pages completed before the failure. Merge it to make that progress the
            baseline for the next scheduled run.

      - name: Annotate OpenWiki update pull request
        if: ${{ !cancelled() && steps.create-pr.outputs.pull-request-url != '' }}
        run: echo "::notice title=OpenWiki update pull request::${{ steps.create-pr.outputs.pull-request-url }}"

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
